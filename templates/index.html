<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>잡스크래퍼</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
            background: #f4f6fa;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        /* 상단 바 */
        .topbar { background: #fff; border-bottom: 1px solid #e5e8ee; }
        .topbar .inner {
            max-width: 1100px; margin: 0 auto; padding: 0 20px;
            height: 56px; display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-size: 24px; font-weight: 800; color: #1a5cff; letter-spacing: -1px; }
        .logo span { color: #ff4d4f; }
        .topbar nav a { margin-left: 20px; font-size: 14px; color: #555; }
        .topbar nav a:hover { color: #1a5cff; }

        /* 메인 검색 영역 */
        .hero {
            flex: 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #fff 0%, #eef3ff 100%);
        }
        .hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
        .hero h1 em { font-style: normal; color: #1a5cff; }
        .hero p { color: #666; margin-bottom: 36px; }

        .search-box {
            width: 100%; max-width: 640px;
            display: flex;
            border: 3px solid #1a5cff; border-radius: 40px;
            background: #fff; overflow: hidden;
            box-shadow: 0 8px 24px rgba(26, 92, 255, 0.15);
        }
        .search-box input {
            flex: 1; border: none; outline: none;
            padding: 18px 26px; font-size: 18px;
        }
        .search-box button {
            border: none; background: #1a5cff; color: #fff;
            padding: 0 34px; font-size: 17px; font-weight: 700; cursor: pointer;
        }
        .search-box button:hover { background: #0f47d6; }

        .tags { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .tags span { font-size: 13px; color: #888; margin-right: 4px; line-height: 30px; }
        .tags a {
            font-size: 13px; padding: 6px 14px;
            border: 1px solid #d5dcea; border-radius: 20px; background: #fff; color: #444;
        }
        .tags a:hover { border-color: #1a5cff; color: #1a5cff; }

        footer { text-align: center; padding: 20px; font-size: 12px; color: #999; background: #fff; border-top: 1px solid #e5e8ee; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 26px; }
            .search-box input { padding: 14px 18px; font-size: 16px; }
            .search-box button { padding: 0 20px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="inner">
            <a href="/" class="logo">job<span>scrapper</span></a>
            <nav>
                <a href="/search?keyword=신입">신입</a>
                <a href="/search?keyword=경력">경력</a>
                <a href="/search?keyword=인턴">인턴</a>
            </nav>
        </div>
    </header>

    <main class="hero">
        <h1>안녕하세요, <em>잡스크래퍼</em>입니다.</h1>
        <p>인크루트 채용공고를 한 번에 검색해 보세요.</p>

        <form action="/search" class="search-box">
            <input type="text" name="keyword" placeholder="직무, 회사, 키워드를 입력하세요" required autofocus />
            <button>검색하기</button>
        </form>

        <div class="tags">
            <span>추천 검색어</span>
            <a href="/search?keyword=파이썬">#파이썬</a>
            <a href="/search?keyword=자바">#자바</a>
            <a href="/search?keyword=프론트엔드">#프론트엔드</a>
            <a href="/search?keyword=데이터분석">#데이터분석</a>
            <a href="/search?keyword=AI">#AI</a>
        </div>
    </main>

    <footer>© 잡스크래퍼 · 데이터 출처: 인크루트</footer>
</body>
</html>
